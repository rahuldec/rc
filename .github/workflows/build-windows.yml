name: Build Windows executable

# Manual only — this is a native build for handing the app to someone on a
# Windows machine with no dev tools, not something that needs to run on
# every push. Trigger it from the Actions tab when you want a fresh .exe.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flask>=3.0.0 PyMuPDF>=1.24.0 pyinstaller

      - name: Build the executable
        run: >
          pyinstaller --onefile --name "PDF-Table-Fixer"
          --collect-all pymupdf --collect-all fitz
          desktop_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Table-Fixer-windows
          path: dist/PDF-Table-Fixer.exe
